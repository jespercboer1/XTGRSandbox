<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KattenNamen - Resultaten</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
        }

        header {
            background: #4CAF50;
        }

        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        nav li {
            flex: 1;
        }

        nav a {
            display: block;
            padding: 15px;
            color: white;
            text-decoration: none;
            text-align: center;
        }

        nav a:hover {
            background: #43a047;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .card h1,
        .card h2 {
            margin-top: 0;
        }

        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item {
            display: grid;
            grid-template-columns: 60px 1fr auto;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }

        /* Afgevallen duo */
        .item.dropped {
            border-color: #dc2626;
            background: #fff5f5;
        }

        /* Top 3 */
        .item.top-1 {
            border-color: #f59e0b;
            background: #fff8e6;
        }

        .item.top-2 {
            border-color: #9ca3af;
            background: #f8fafc;
        }

        .item.top-3 {
            border-color: #b45309;
            background: #fff4e6;
        }

        .rank {
            font-weight: bold;
            font-size: 20px;
            margin-left: 8px;
            color: #4CAF50;
        }

        .item.top-1 .rank,
        .item.top-1 .score {
            color: #b45309;
        }

        .item.top-2 .rank,
        .item.top-2 .score {
            color: #6b7280;
        }

        .item.top-3 .rank,
        .item.top-3 .score {
            color: #b45309;
        }

        /* Afgevallen items altijd rood */
        .item.dropped .rank,
        .item.dropped .score,
        .item.dropped .name {
            color: #b91c1c;
        }

        .name {
            font-size: 18px;
        }

        .score {
            font-weight: bold;
        }

        .subscores {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
            color: #666;
            font-size: 13px;
        }

        /* Ook de individuele scores rood bij afgevallen duo's */
        .item.dropped .subscores {
            color: #b91c1c;
        }

        @media (max-width: 700px) {
            nav ul {
                flex-direction: column;
            }

            .item {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Andere gebruiker kiezen</a></li>
                <li><a href="invoeren-individueel.html">Invoeren individuele namen</a></li>
                <li><a href="voting-individueel.html">Voting individuele namen</a></li>
                <li><a href="tussenstand.html">Tussenstand</a></li>
                <li><a href="koppelen-duo.html">Koppelen duo namen</a></li>
                <li><a href="voting-duo.html">Voting duo namen</a></li>
                <li><a href="resultaten.html">Resultaten</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="card">
            <h1>Resultaten duo's</h1>
            <div id="leaderboard" class="leaderboard"></div>
        </div>
    </main>

    <script>
        async function loadResults() {
            try {
                const response = await fetch("api/get_duo_name_results.php");
                const results = await response.json();

                const list = document.getElementById("leaderboard");
                list.innerHTML = "";

                if (results.length === 0) {
                    list.innerHTML = '<p class="muted">Er zijn nog geen resultaten beschikbaar.</p>';
                    return;
                }

                /*
                 * Duo's met has_one = 1 worden onderaan geplaatst.
                 * Binnen beide groepen wordt gesorteerd op gemiddelde score,
                 * van hoog naar laag.
                 */
                results.sort((a, b) => {
                    const aDropped = Number(a.has_one) === 1;
                    const bDropped = Number(b.has_one) === 1;

                    // Duo's met een 1 altijd onderaan
                    if (aDropped !== bDropped) {
                        return aDropped ? 1 : -1;
                    }

                    // Hoogste gemiddelde score eerst
                    return Number(b.average_score) - Number(a.average_score);
                });

                results.forEach((item, index) => {
                    const isDropped = Number(item.has_one) === 1;

                    const row = document.createElement("div");

                    /*
                     * Alleen actieve duo's kunnen top 1, 2 of 3 zijn.
                     * Afgevallen duo's krijgen altijd alleen "dropped".
                     */
                    let classes = "item";

                    if (isDropped) {
                        classes += " dropped";
                    } else if (index === 0) {
                        classes += " top-1";
                    } else if (index === 1) {
                        classes += " top-2";
                    } else if (index === 2) {
                        classes += " top-3";
                    }

                    row.className = classes;

                    // Rangnummer
                    const rank = document.createElement("div");
                    rank.className = "rank";
                    rank.innerText = index + 1;

                    // Naam
                    const content = document.createElement("div");
                    content.className = "name";
                    content.innerText = item.name;

                    // Individuele scores
                    const subscores = document.createElement("div");
                    subscores.className = "subscores";

                    subscores.innerHTML = [
                        "Jesper: " + (item.jesper_score ?? "-"),
                        "Elianne: " + (item.elianne_score ?? "-"),
                        "Carin: " + (item.carin_score ?? "-"),
                        "Arjan: " + (item.arjan_score ?? "-")
                    ].join(" | ");

                    // Gemiddelde score
                    const score = document.createElement("div");
                    score.className = "score";
                    score.innerText = "Gemiddelde: " + item.average_score;

                    content.appendChild(subscores);

                    row.appendChild(rank);
                    row.appendChild(content);
                    row.appendChild(score);

                    list.appendChild(row);
                });

            } catch (error) {
                console.error("Fout bij laden van resultaten:", error);

                const list = document.getElementById("leaderboard");
                list.innerHTML = "<p>Er is een fout opgetreden bij het laden van de resultaten.</p>";
            }
        }

        loadResults();
    </script>
</body>
</html>
