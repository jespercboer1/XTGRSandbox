<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Kattennamen - login</title>
    
    <style>
    body {
        font-family: Arial;
        background:#f2f2f2;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .box {

        background:white;
        padding:30px;
        border-radius:10px;
        width:350px;
        text-align:center;
    }

    button {
        width:100%;
        padding:12px;
        margin:8px 0;
        border:none;
        border-radius:5px;
        background:#4caf50;
        color:white;
        font-size:16px;
        cursor:pointer;
    }

    input {
        width:90%;
        padding:10px;
        margin:8px;
        text-align:center;
        font-size:20px;
        letter-spacing:5px;
    }

    .hidden {
        display:none;
    }

    .error {
        color:red;
    }
    </style>
</head>

<body>
    <div class="box">
        <h2>Kies gebruiker</h2>
        <div id="users"></div>

        <div id="login" class="hidden">
            <h3 id="username"></h3>

            <div id="create">
                <p>Maak een 5 cijferige code</p>

                <input 
                id="newPassword"
                maxlength="5"
                type="password"
                inputmode="numeric">

                <input 
                id="repeatPassword"
                maxlength="5"
                type="password"
                inputmode="numeric">

                <button onclick="createPassword()">Opslaan</button>
                <button onclick="goBack()" style="background:#777;">Terug</button>
            </div>

            <div id="enter" class="hidden">
                <p>Vul je code in</p>

                <input
                id="password"
                maxlength="5"
                type="password"
                inputmode="numeric">

                <button onclick="login()">Inloggen</button>
                <button onclick="goBack()" style="background:#777;">Terug</button>
            </div>

            <p id="message" class="error"></p>
        </div>
    </div>

<script>
    let users = [];
    let selectedUser = null;

    async function loadUsers(){
        let response = await fetch(
            "api/users.php"
        );

        users = await response.json();

        let container =
            document.getElementById("users");

        users.forEach(user => {
            let button =
            document.createElement("button");

            button.innerText =
                user.username;

            button.onclick = () =>
                selectUser(user);

            container.appendChild(button);
        });
    }

    function selectUser(user){
        selectedUser = user;

        document
        .getElementById("users")
        .classList.add("hidden");

        document
        .getElementById("login")
        .classList.remove("hidden");

        document
        .getElementById("username")
        .innerText =
            user.username;

        if(user.passcode === null){
            document
            .getElementById("create")
            .classList.remove("hidden");

            document
            .getElementById("enter")
            .classList.add("hidden");

        } else {
            document
            .getElementById("create")
            .classList.add("hidden");

            document
            .getElementById("enter")
            .classList.remove("hidden");
        }
    }

    async function createPassword(){
        let password =
        document.getElementById("newPassword").value;

        let repeat =
        document.getElementById("repeatPassword").value;

        if(password.length !== 5 ||
        !/^[0-9]+$/.test(password)){
            error("Gebruik 5 cijfers");
            return;
        }

        if(password !== repeat){
            error("Codes zijn niet gelijk");
            return;
        }

        await fetch(
            "api/set_passcode.php",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({
                    user_id:selectedUser.id,
                    passcode:password
                })
            }
        );

        localStorage.setItem(
            "user_id",
            selectedUser.id
        );
        localStorage.setItem(
            "username",
            selectedUser.username
        );

        location.href =
            "invoeren-individueel.html";
    }

    function login(){
        let password =
        document.getElementById("password").value;

        if(selectedUser.id == 1 && password === "67667"){
            localStorage.setItem(
                "user_id",
                selectedUser.id
            );
            localStorage.setItem(
                "username",
                selectedUser.username
            );

            location.href = "admin.html";
            
        } else if(password === selectedUser.passcode){
            localStorage.setItem(
                "user_id",
                selectedUser.id
            );
            localStorage.setItem(
                "username",
                selectedUser.username
            );

            location.href =
                "invoeren-individueel.html";

        } else {
            error(
                "Verkeerde code"
            );
        }
    }

    function goBack(){
        selectedUser = null;

        document
        .getElementById("login")
        .classList.add("hidden");

        document
        .getElementById("users")
        .classList.remove("hidden");


        document.getElementById("message")
        .innerText = "";

    }

    function error(text){
    document.getElementById("message")
    .innerText=text;
    }

    loadUsers();
</script>

</body>
</html>
