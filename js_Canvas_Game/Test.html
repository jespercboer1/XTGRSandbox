<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple 2D Maze Game</title>
  <style>
    /* Style for the game canvas and block */
    canvas {
      border: 2px solid black;
      background-color: #f4f4f4;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Define player properties
    const player = {
      x: 20,
      y: 20,
      width: 20,
      height: 20,
      color: "blue",
      speed: 5,
    };

    // Define walls (as x, y, width, height)
    const walls = [
      { x: 100, y: 0, width: 20, height: 200 },
      { x: 100, y: 250, width: 20, height: 150 },
      { x: 200, y: 150, width: 200, height: 20 },
      { x: 300, y: 150, width: 20, height: 250 },
      { x: 50, y: 300, width: 100, height: 20 }
    ];

    // Movement controls
    const keys = {
      w: false,
      a: false,
      s: false,
      d: false
    };

    // Event listeners for key press and release
    document.addEventListener("keydown", (event) => {
      if (event.key === "w") keys.w = true;
      if (event.key === "a") keys.a = true;
      if (event.key === "s") keys.s = true;
      if (event.key === "d") keys.d = true;
    });

    document.addEventListener("keyup", (event) => {
      if (event.key === "w") keys.w = false;
      if (event.key === "a") keys.a = false;
      if (event.key === "s") keys.s = false;
      if (event.key === "d") keys.d = false;
    });

    // Game loop
    function gameLoop() {
      // Clear the canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Move player based on keys
      if (keys.w) player.y -= player.speed;
      if (keys.s) player.y += player.speed;
      if (keys.a) player.x -= player.speed;
      if (keys.d) player.x += player.speed;

      // Prevent the player from moving through walls
      walls.forEach(wall => {
        if (isColliding(player, wall)) {
          if (keys.w) player.y += player.speed;
          if (keys.s) player.y -= player.speed;
          if (keys.a) player.x += player.speed;
          if (keys.d) player.x -= player.speed;
        }
      });

      // Draw player
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // Draw walls
      ctx.fillStyle = "black";
      walls.forEach(wall => {
        ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
      });

      // Keep the game running
      requestAnimationFrame(gameLoop);
    }

    // Collision detection function
    function isColliding(rect1, rect2) {
      return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
      );
    }

    // Start the game loop
    gameLoop();
  </script>
</body>
</html>
