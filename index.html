<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/x-icon" href="images/favicon.png">

  <title>My Projects</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>


<body class="bg-gray-950 text-white min-h-screen">

  <!-- =====================================================
       Background
       ===================================================== -->

  <div class="page-glow"></div>


  <!-- =====================================================
       Header
       ===================================================== -->

  <header class="relative z-10 w-full max-w-6xl mx-auto px-6 pt-10 pb-12">

    <div class="flex items-center gap-4 mb-5">

      <div class="header-line"></div>

      <span class="text-sm font-semibold tracking-[0.25em] uppercase text-orange-500">
        Portfolio
      </span>

    </div>


    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6">

      <div>

        <h1 class="text-5xl md:text-6xl font-bold tracking-tight">
          My Projects
        </h1>

        <p class="mt-4 text-gray-400 text-lg max-w-xl">
          A collection of projects, experiments and things I've built.
        </p>

      </div>


      <div class="text-left md:text-right">

        <p class="text-sm text-gray-500">
          Created by
        </p>

        <p class="text-lg font-semibold text-gray-200">
          XTGR
        </p>

      </div>

    </div>


    <!-- Header divider -->

    <div class="mt-10 h-px bg-gradient-to-r from-orange-500/60 via-gray-700 to-transparent"></div>

  </header>



  <!-- =====================================================
       Projects
       ===================================================== -->

  <main class="relative z-10 w-full max-w-6xl mx-auto px-6 pb-32">

    <div
      id="gameList"
      class="grid grid-cols-1 md:grid-cols-2 gap-6">
    </div>

  </main>



  <!-- =====================================================
       Tooltip
       ===================================================== -->

  <div
    id="tooltip"
    class="hidden absolute bg-gray-800/95 backdrop-blur-md
           border border-gray-700
           rounded-2xl p-4
           shadow-2xl shadow-black/40
           z-40 flex flex-col items-center text-center
           w-64">

    <div class="popup-arrow"></div>

    <div
      id="tooltipLinks"
      class="flex flex-col gap-2 mb-3 w-full">
    </div>

    <a
      id="tooltipOpen"
      target="_blank"
      class="bg-green-600 hover:bg-green-500
             px-4 py-2.5
             rounded-xl
             font-semibold text-sm
             w-full
             transition-all duration-200
             hover:-translate-y-0.5
             shadow-lg shadow-green-900/20">

      🚀 Open Project

    </a>

  </div>



  <!-- =====================================================
       Overlay
       ===================================================== -->

  <div
    id="overlayPopup"
    class="hidden fixed inset-0
           bg-black/75 backdrop-blur-sm
           flex items-center justify-center
           z-50 p-6">

    <div
      class="bg-gray-800/95
             border border-gray-700
             rounded-3xl
             p-7
             w-full max-w-md
             relative
             text-center
             shadow-2xl shadow-black/50">

      <!-- Close -->

      <button
        id="closeOverlay"
        class="absolute top-4 right-4
               w-9 h-9
               flex items-center justify-center
               rounded-full
               bg-gray-700/50
               text-gray-400
               hover:bg-orange-500
               hover:text-white
               transition-all duration-200
               text-xl">

        &times;

      </button>


      <!-- Title -->

      <h2
        id="overlayTitle"
        class="text-2xl font-bold mb-4 pr-8">
      </h2>


      <!-- Content -->

      <p
        id="overlayContent"
        class="text-gray-300
               whitespace-pre-line
               text-sm
               leading-relaxed
               mb-5">
      </p>


      <!-- Files -->

      <div
        id="overlayFiles"
        class="flex gap-2 justify-center flex-wrap">
      </div>

    </div>

  </div>



  <!-- =====================================================
       Utility Buttons
       ===================================================== -->

  <div class="fixed top-6 right-6 flex gap-3 z-50">

    <!-- Help -->

    <button
      id="helpBtn"
      aria-label="Help"
      class="utility-btn group">

      <span class="utility-icon">?</span>

      <span class="utility-tooltip">
        Help
      </span>

    </button>


    <!-- Information -->

    <button
      id="infoBtn"
      aria-label="Information"
      class="utility-btn group">

      <span class="utility-icon info-icon">i</span>

      <span class="utility-tooltip">
        Information
      </span>

    </button>

  </div>



  <!-- =====================================================
       Authentication
       ===================================================== -->

  <div
    class="fixed bottom-7 right-7 z-50
           flex gap-3">

    <!-- Register -->

    <button
      id="RegisterBtn"
      class="auth-btn auth-btn-secondary">

      <span class="auth-icon">+</span>

      <span>Register</span>

    </button>


    <!-- Login -->

    <button
      id="LoginBtn"
      class="auth-btn auth-btn-primary">

      <span class="auth-icon">→</span>

      <span>Login</span>

    </button>

  </div>



  <script src="script.js"></script>

</body>

</html>
