<!DOCTYPE html>
<html>
<head>
  <title>Fast Food Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="clock">Time: 08:00</div>
  <div id="newOrders"></div>
  <div id="nextOrderTimer">Next order in: ?</div>
  <div id="pendingOrders"></div>
  <button id="openRestaurantButton">open restaurant</button>
  <div id="money">$0</div>

  <div id="grillContainer"></div>

  <div id="storage">Storage:</div>

  <button id="openComputerButton">Computer</button>
  <button id="giveMoney" class="hidden_button">Give Money</button>

  <div id="computerScreen">
    <div id="computerScreenTop">
      <button id="closeComputerScreen" class="close_button">Close Computer</button>
      <button id="openShopButton">Shop</button>
      <button id="openStorageButton">Storage</button>
      <div id="shopScreen">
        <button id="closeShopButton" class="close_button">Close Shop</button>
        <button id="buyBuns">Buy 12 Burger Buns</button>
        <button id="buyPatties">Buy 24 Burger Patties</button>
        <button id="buyCheeseSlices">Buy 24 Slices of Cheese</button>
        <button id="buyLettuceHeads">Buy 6 Lettuce Heads</button>
        <button id="buyKetchupRefills">Buy 1 Ketchup Refill</button>
        <button id="buyCokeDrinkContainer">Buy 1 Coke drink container</button>
        <button id="buyPepsiDrinkContainer">Buy 1 Pepsi drink container</button>
        <button id="buySpriteDrinkContainer">Buy 1 Sprite drink container</button>
        <button id="buyFantaDrinkContainer">Buy 1 Fanta drink container</button>
        <button id="buyIcecreamContainer">Buy 1 Icecream container</button>
        <button id="buyBrownies">Buy 12 Brownies</button>
        <button id="buyCookies">Buy 12 Cookies</button>
      </div>
      <div id="storageScreen">
        <button id="closeStorageButton" class="close_button">Close Storage</button>
      </div>
    </div>
  </div>
</body>

<script type="module" src="script.js"></script>
</html>
